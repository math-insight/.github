name: "Błąd"
description: "Zgłoś problem z kodem, stroną lub dokumentacją."
body:
  - type: textarea
    id: problem
    attributes:
      label: "Opis problemu"
      description: "Co nie działa? Dodaj komunikat błędu lub zrzut ekranu, jeśli pomaga."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "Jak odtworzyć problem?"
      description: "Podaj kroki, adres strony lub polecenie oraz istotne informacje o środowisku."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Oczekiwany rezultat"
    validations:
      required: true

